<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดร้าน | กินไหนดีคลองหก</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/restaurant-detail.css">
</head>
<body data-root="../">

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <a href="../index.html" class="logo"><img src="../images/logo.png" alt="กินไหนดีคลองหก"></a>
    <nav class="menu">
      <a href="../index.html">หน้าแรก</a>
      <a href="../restaurant/restaurants.html" class="active">ร้านอาหาร</a>
      <a href="../about/about.html">เกี่ยวกับเรา</a>
    </nav>
  </header>

  <main class="container">
    <section class="detail">

      <a href="../restaurant/restaurants.html" class="back">&lt; — รายละเอียดทั้งหมด</a>

      <div class="detail-top">
        <!-- กล่องซ้าย: รูป + ข้อมูลร้าน -->
        <div class="detail-box detail-main">
          <img id="detail-img" class="detail-img" src="" alt="">
          <div class="detail-info">
            <h1 id="detail-name"></h1>
            <p id="detail-rating"></p>
            <p id="detail-category"></p>
            <p id="detail-address"></p>
            <p id="detail-phone"></p>
            <p id="detail-hours"></p>
            <div class="gallery" id="detail-gallery"></div>
          </div>
        </div>

        <!-- กล่องขวา: ตำแหน่งร้าน -->
        <div class="detail-box detail-location">
          <h2 class="location-title"><img src="../images/icons/pin.svg" alt=""> ตำแหน่งร้าน</h2>
          <iframe id="detail-map" class="map" loading="lazy" title="แผนที่ร้าน"></iframe>
          <a id="detail-route" href="#" target="_blank" class="btn">ดูเส้นทาง</a>
        </div>
      </div>

      <!-- กล่องล่าง: เมนู -->
      <div class="detail-box menu-box" id="detail-menu"></div>

    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer>@ 2026 กินไหนดีคลองหก</footer>
