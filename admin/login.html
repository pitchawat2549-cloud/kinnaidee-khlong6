<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้ดูแล | กินไหนดีคลองหก</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/favicon/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="../images/favicon/favicon-192.png?v=2">
  <link rel="apple-touch-icon" href="../images/favicon/apple-touch-icon.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css?v=20261018d">
  <link rel="stylesheet" href="../css/admin.css?v=20261018d">
</head>
<body data-root="../" data-page="admin" class="admin-login">

  <main class="login-box">
    <a href="../index.html"><img src="../images/logo.png" alt="กินไหนดีคลองหก" class="login-logo"></a>
    <h1>สำหรับผู้ดูแลระบบ</h1>
    <p class="muted">เข้าสู่ระบบเพื่อเพิ่ม แก้ไข หรือลบร้านอาหาร</p>

    <div class="notice" id="not-configured" hidden>
      <b>ยังไม่ได้เชื่อมฐานข้อมูล</b>
      <p>ใส่ค่า SUPABASE_URL และ SUPABASE_ANON_KEY ในไฟล์ <code>js/config.js</code> ก่อน (ดูวิธีใน README.md)</p>
    </div>

    <form id="login-form" class="login-form" novalidate>
      <label class="field">อีเมล <input type="email" id="email" autocomplete="username" required></label>
      <label class="field">รหัสผ่าน <input type="password" id="password" autocomplete="current-password" required></label>
      <p class="form-msg" role="alert" id="login-msg"></p>
      <button class="btn btn-lg" type="submit">เข้าสู่ระบบ</button>
    </form>
    <a href="../index.html" class="back-site">← กลับหน้าเว็บ</a>
  </main>

  <script src="../js/config.js?v=20261018d"></script>
  <script src="../js/seed-data.js?v=20261018d"></script>
  <script src="../js/api.js?v=20261018d"></script>
  <script src="../js/ui.js?v=20261018d"></script>
  <script>    (async () => {
      if (!DB.configured) {
        $("#not-configured").hidden = false;
        $$("#login-form input, #login-form button").forEach(el => (el.disabled = true));
        return;
      }
      if (await DB.admin.session()) location.replace("index.html");
      $("#login-form").addEventListener("submit", async e => {
        e.preventDefault();
        const msg = $("#login-msg");
        const email = $("#email").value.trim(), password = $("#password").value;
        if (!email || !password) { msg.textContent = "กรุณากรอกอีเมลและรหัสผ่าน"; return; }
        const btn = $("button[type=submit]");
        btn.disabled = true; btn.textContent = "กำลังเข้าสู่ระบบ…";
        try {
          await DB.admin.signIn(email, password);
          location.replace("index.html");
        } catch (err) {
          msg.textContent = err.message;
          btn.disabled = false; btn.textContent = "เข้าสู่ระบบ";
        }
      });
    })();
  </script>
</body>
</html>
