<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการร้าน | กินไหนดีคลองหก</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../images/favicon/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="../images/favicon/favicon-192.png?v=2">
  <link rel="apple-touch-icon" href="../images/favicon/apple-touch-icon.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css?v=20261018d">
  <link rel="stylesheet" href="../css/admin.css?v=20261018d">
</head>
<body data-root="../" data-page="admin">

  <header class="admin-bar">
    <a href="../index.html" class="admin-brand"><img src="../images/logo.png" alt=""> ระบบจัดการร้าน</a>
    <div class="admin-user">
      <span id="admin-email"></span>
      <a href="../index.html" target="_blank" rel="noopener" class="btn btn-ghost">ดูหน้าเว็บ</a>
      <button type="button" class="btn" id="logout">ออกจากระบบ</button>
    </div>
  </header>

  <main class="admin-main">
    <nav class="admin-tabs" role="tablist">
      <button type="button" role="tab" class="active" data-tab="restaurants" aria-selected="true">ร้านอาหาร <small id="count-restaurants"></small></button>
      <button type="button" role="tab" data-tab="suggestions" aria-selected="false">ข้อความจากผู้ใช้ <small id="count-new"></small></button>
    </nav>

    <section id="tab-restaurants">
      <div class="admin-toolbar">
        <input type="search" id="admin-search" placeholder="ค้นหาชื่อร้าน หรือรหัสร้าน" aria-label="ค้นหาร้าน">
        <button type="button" class="btn" id="add-restaurant">+ เพิ่มร้านใหม่</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>รูป</th><th>ชื่อร้าน</th><th>หมวด</th><th>เวลาเปิด-ปิด</th><th>สถานะ</th><th>แก้ไขล่าสุด</th><th></th></tr>
          </thead>
          <tbody id="restaurant-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-suggestions" hidden>
      <div class="suggestion-list" id="suggestion-list"></div>
    </section>
  </main>

  <script src="../js/config.js?v=20261018d"></script>
  <script src="../js/seed-data.js?v=20261018d"></script>
  <script src="../js/api.js?v=20261018d"></script>
  <script src="../js/ui.js?v=20261018d"></script>
  <script src="../js/admin.js?v=20261018d"></script>
</body>
</html>
