<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านอาหารทั้งหมด | กินไหนดีคลองหก</title>
  <meta name="description" content="ค้นหาร้านอาหารในคลองหก กรองตามหมวด พื้นที่ งบ และร้านที่เปิดอยู่">
  <link rel="icon" href="../images/favicon/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="../images/favicon/favicon-192.png?v=2">
  <link rel="apple-touch-icon" href="../images/favicon/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/restaurants.css">
</head>
<body data-root="../" data-page="restaurants">

  <header id="site-header"></header>

  <main class="container">

    <!-- ===== Hero + ค้นหา ===== -->
    <section class="hero hero-restaurants">
      <div class="hero-text">
        <h1>ร้านอาหารคลองหก</h1>
        <p>ค้นหาด้วยชื่อร้าน ชื่อเมนู หรือชื่อซอย</p>
        <form class="search-bar" id="search-form" role="search">
          <img src="../images/icons/search.svg" alt="">
          <input type="search" id="search-input" placeholder="เช่น กะเพรา, หม่าล่า, พรธิสาร" aria-label="ค้นหาร้านหรือเมนู">
          <button class="btn" type="submit">ค้นหา</button>
        </form>
      </div>
      <img src="../images/decor/fastfood.png" alt="" class="img-fastfood">
    </section>

    <!-- ===== ตัวกรอง ===== -->
    <section class="filters" aria-label="ตัวกรอง">
      <div class="filter-row">
        <h3>ประเภทอาหาร</h3>
        <div class="chips" id="filter-category"></div>
      </div>
      <div class="filter-row">
        <h3>พื้นที่</h3>
        <div class="chips" id="filter-area"></div>
      </div>
      <div class="filter-row filter-extra">
        <label class="check"><input type="checkbox" id="f-open"> เปิดอยู่ตอนนี้</label>
        <label class="field field-inline">งบต่อมื้อ
          <select id="f-budget">
            <option value="0">ไม่จำกัด</option>
            <option value="50">ไม่เกิน 50 บาท</option>
            <option value="80">ไม่เกิน 80 บาท</option>
            <option value="120">ไม่เกิน 120 บาท</option>
          </select>
        </label>
      </div>
    </section>

    <!-- ===== รายชื่อร้าน ===== -->
    <section class="section">
      <div class="section-head result-head">
        <div>
          <h2>ร้านอาหาร</h2>
          <p class="muted result-count" id="restaurant-count" aria-live="polite"></p>
        </div>
        <div class="result-tools">
          <button type="button" class="link-btn clear-btn" id="clear-filters" hidden>ล้างตัวกรอง</button>
          <label class="sort">เรียงตาม
            <select id="sort">
              <option value="random">สุ่ม (ทุกร้านเท่าเทียม)</option>
              <option value="name">ชื่อร้าน ก-ฮ</option>
              <option value="price">ราคาน้อย → มาก</option>
              <option value="open">ร้านที่เปิดอยู่ก่อน</option>
            </select>
          </label>
        </div>
      </div>
      <div class="restaurant-list" id="restaurant-list"></div>
      <nav class="pagination" id="pagination" aria-label="เลือกหน้า"></nav>
    </section>

  </main>

  <footer id="site-footer"></footer>

  <script src="../js/config.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/restaurants.js"></script>
</body>
</html>
