<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไม่พบหน้านี้ | กินไหนดีคลองหก</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/kinnaidee-khlong6/images/favicon/favicon.ico?v=2" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 0 20px;
      box-sizing: border-box;
      background: #FDFBF6;
      color: #3B2A22;
      text-align: center;
    }
    .code {
      margin: 0;
      font-family: "Kanit", sans-serif;
      font-size: clamp(96px, 16vw, 160px);
      font-weight: 600;
      line-height: 1;
      color: #D96A33;
    }
    h1 {
      margin: 14px 0 8px;
      font-family: "Kanit", sans-serif;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 500;
    }
    p {
      margin: 0 auto;
      max-width: 460px;
      font-family: "Sarabun", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #7A6455;
    }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>ไม่พบหน้านี้</h1>
    <p>ลิงก์อาจพิมพ์ผิด หรือหน้านี้ถูกย้ายไปแล้ว ลองกลับหน้าแรก หรือให้เว็บสุ่มร้านให้เลยก็ได้</p>
  </main>
</body>
</html>
